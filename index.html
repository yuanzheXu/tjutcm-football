<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天津中医药大学足球联赛</title>
<meta name="description" content="天津中医药大学足球联赛 · 积分榜、赛程、球队榜与射手榜">
<meta name="theme-color" content="#00873C">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css?v=20261019">
</head>
<body>

<div class="app">

  <header class="site-head">
    <div class="brand">
      <img class="brand__emblem" src="assets/logo.png" alt="天津中医药大学校徽">
      <img class="brand__wordmark" src="assets/logo_font.png" alt="天津中医药大学">
      <span class="brand__divider"></span>
      <span class="brand__league">足球联赛</span>
    </div>
    <div class="site-head__meta">
      <span class="site-head__season" id="season"></span>
    </div>
  </header>

  <section class="hero" aria-label="联赛封面">
    <div class="hero__stage">
      <img class="hero__layer hero__layer--cover is-active" src="assets/hero/cover.jpg" alt="" decoding="async" fetchpriority="high">
      <img class="hero__layer" src="assets/hero/standings.jpg" alt="" decoding="async">
      <img class="hero__layer" src="assets/hero/fixtures.jpg" alt="" decoding="async">
      <img class="hero__layer" src="assets/hero/teams.jpg" alt="" decoding="async">
      <img class="hero__layer" src="assets/hero/scorers.jpg" alt="" decoding="async">
      <div class="hero__shade"></div>
      <div class="hero__copy">
        <p class="hero__eyebrow">2026 赛季 · 校园足球</p>
        <h1>天津中医药大学<br><span>足球联赛</span></h1>
      </div>
      <div class="hero__dots" id="hero-dots" aria-label="封面图切换">
        <button class="hero__dot is-active" type="button" aria-label="第 1 张封面图" aria-current="true"></button>
        <button class="hero__dot" type="button" aria-label="第 2 张封面图"></button>
        <button class="hero__dot" type="button" aria-label="第 3 张封面图"></button>
        <button class="hero__dot" type="button" aria-label="第 4 张封面图"></button>
        <button class="hero__dot" type="button" aria-label="第 5 张封面图"></button>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs" aria-label="主导航">
    <button class="tab active" data-page="page-standings">积分榜</button>
    <button class="tab" data-page="page-fixtures">赛程</button>
    <button class="tab" data-page="page-teams">球队榜</button>
    <button class="tab" data-page="page-scorers">射手榜</button>
  </nav>

  <main>

    <!-- ── 积分榜 ─────────────────────────────────── -->
    <section class="page active" id="page-standings">
      <div class="metrics" id="metrics"></div>
      <div id="standings-notice"></div>

      <div class="head">
        <h2>积分榜</h2>
        <span class="note">胜 3 分 · 平 1 分 · 负 0 分 ｜<br class="br-sm">依次比较积分、净胜球、进球数</span>
      </div>

      <div class="table-wrap">
        <table class="standings">
          <thead>
            <tr>
              <th>#</th>
              <th>球队</th>
              <th>场</th>
              <th>胜</th>
              <th>平</th>
              <th>负</th>
              <th class="col-hide-sm">进</th>
              <th class="col-hide-sm">失</th>
              <th>净</th>
              <th>积分</th>
            </tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
      </div>
    </section>

    <!-- ── 赛程 ───────────────────────────────────── -->
    <section class="page" id="page-fixtures">
      <div class="head">
        <h2>赛程与结果</h2>
        <span class="note" id="updated"></span>
      </div>
      <div class="chips" id="chips">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="scheduled">未赛</button>
        <button class="chip" data-filter="played">已赛</button>
      </div>
      <div id="fixtures"></div>
    </section>

    <!-- ── 球队榜 ─────────────────────────────────── -->
    <section class="page" id="page-teams">
      <div id="teams-notice"></div>
      <div class="rank-grid">
        <div>
          <div class="head"><h2>进球榜</h2><span class="note">进球最多</span></div>
          <div class="rank" id="rank-gf"></div>
        </div>
        <div>
          <div class="head"><h2>失球榜</h2><span class="note">失球最少在前</span></div>
          <div class="rank" id="rank-ga"></div>
        </div>
      </div>
    </section>

    <!-- ── 射手榜 ─────────────────────────────────── -->
    <section class="page" id="page-scorers">
      <div class="head">
        <h2>射手榜</h2>
        <span class="note">按进球数排序</span>
      </div>
      <div id="scorers"></div>
    </section>

  </main>

  <footer class="site-foot">
    <p class="site-foot__motto">进德修业　继承创新</p>
    <p id="foot-league"></p>
    <p>校徽与校名版权归天津中医药大学，本页仅作联赛信息展示。</p>
  </footer>

</div>

<script src="data/league.js"></script>
<script>
(function () {
  var D = window.LEAGUE;
  if (!D) return;

  var P = D.points || { win: 3, draw: 1, loss: 0 };
  var $ = function (id) { return document.getElementById(id); };

  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };
  var sign = function (n) { return n > 0 ? "+" + n : String(n); };

  function fmtDate(iso) {
    var p = String(iso).split("-");
    return p.length === 3 ? (+p[1]) + "月" + (+p[2]) + "日" : iso;
  }

  /* ── 从比赛结果算积分榜 ─────────────────────────── */

  function buildStandings() {
    var rows = {};

    function row(team) {
      if (!rows[team]) {
        rows[team] = { team: team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
      }
      return rows[team];
    }

    (D.teams || []).forEach(row);

    (D.matches || []).forEach(function (m) {
      row(m.home); row(m.away);
      if (m.status !== "played") return;

      var h = row(m.home), a = row(m.away);
      h.p++; a.p++;
      h.gf += m.hg; h.ga += m.ag;
      a.gf += m.ag; a.ga += m.hg;

      if (m.hg > m.ag)      { h.w++; a.l++; h.pts += P.win; }
      else if (m.hg < m.ag) { a.w++; h.l++; a.pts += P.win; }
      else                  { h.d++; a.d++; h.pts += P.draw; a.pts += P.draw; }
    });

    return Object.keys(rows).map(function (k) {
      var r = rows[k];
      r.gd = r.gf - r.ga;
      return r;
    }).sort(function (x, y) {
      return y.pts - x.pts
          || y.gd - x.gd
          || y.gf - x.gf
          || x.team.localeCompare(y.team, "zh-Hans-CN");
    });
  }

  /* ── 从 scorers 汇总射手榜 ──────────────────────── */

  /* 比赛里的 scorers 和手填的 manualScorers 汇总到一张表里，
     键是「队名|姓名」，所以重名球员只要队不一样就分开算。 */
  function buildScorers() {
    var by = {};

    function add(team, name, goals) {
      var k = team + "|" + name;
      if (!by[k]) by[k] = { name: name, team: team, goals: 0 };
      by[k].goals += goals;
    }

    (D.matches || []).forEach(function (m) {
      if (m.status !== "played" || !m.scorers) return;

      [["home", m.home], ["away", m.away]].forEach(function (side) {
        (m.scorers[side[0]] || []).forEach(function (name) {
          add(side[1], name, 1);
        });
      });
    });

    (D.manualScorers || []).forEach(function (s) {
      if (s && s.name) add(s.team || "", s.name, s.goals || 0);
    });

    return Object.keys(by).map(function (k) { return by[k]; })
      .sort(function (a, b) {
        return b.goals - a.goals
            || a.name.localeCompare(b.name, "zh-Hans-CN");
      });
  }

  var standings = buildStandings();
  var scorers   = buildScorers();
  var playedList = (D.matches || []).filter(function (m) { return m.status === "played"; });
  var hasResults = playedList.length > 0;

  /* ── 渲染：数据条 ───────────────────────────────── */

  function renderMetrics() {
    var goals = playedList.reduce(function (s, m) { return s + m.hg + m.ag; }, 0);

    var items = [
      ["参赛队伍", (D.teams || []).length],
      ["总场次",   (D.matches || []).length],
      ["已赛场次", playedList.length],
      ["已进球",   goals],
    ];

    $("metrics").innerHTML = items.map(function (it) {
      return '<div class="metric"><b>' + it[1] + '</b><span>' + it[0] + '</span></div>';
    }).join("");
  }

  /* ── 渲染：积分榜 ───────────────────────────────── */

  function renderStandings() {
    $("standings-body").innerHTML = standings.map(function (r, i) {
      return "<tr>" +
        "<td>" + (i + 1) + "</td>" +
        "<td>" + esc(r.team) + "</td>" +
        "<td>" + r.p + "</td>" +
        "<td>" + r.w + "</td>" +
        "<td>" + r.d + "</td>" +
        "<td>" + r.l + "</td>" +
        '<td class="col-hide-sm">' + r.gf + "</td>" +
        '<td class="col-hide-sm">' + r.ga + "</td>" +
        "<td>" + sign(r.gd) + "</td>" +
        '<td class="col-points">' + r.pts + "</td>" +
      "</tr>";
    }).join("");

    document.querySelector("table.standings")
      .classList.toggle("has-results", hasResults);

    $("standings-notice").innerHTML = hasResults
      ? ""
      : '<div class="empty">比赛尚未开始，积分榜将在首场比赛结果录入后自动更新。</div>';
  }

  /* ── 渲染：排行榜条 ─────────────────────────────── */

  /* rows: [{name, sub, value}] —— 按 value 画相对长度的细条
     hasData 由调用方给：不要拿 rows[0].value 判断有没有数据，
     失球榜是升序排的，第一名失球 0 个会被误判成"没数据"。
     同理 max 要取全表最大值，不能取 rows[0]。 */
  function renderRank(el, rows, unit, hasData) {
    if (!hasData || !rows.length) {
      el.innerHTML = '<div class="empty">暂无记录，录入比赛结果后自动生成。</div>';
      return;
    }
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }));

    el.innerHTML = rows.map(function (r, i) {
      var pct = max > 0 ? Math.max(6, Math.round(r.value / max * 100)) : 0;
      return '<div class="rank__row">' +
        '<span class="rank__no">' + (i + 1) + "</span>" +
        '<span class="rank__name">' + esc(r.name) +
          (r.sub ? '<em>' + esc(r.sub) + "</em>" : "") + "</span>" +
        '<span class="rank__bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="rank__val">' + r.value +
          (unit ? '<em>' + unit + "</em>" : "") + "</span>" +
      "</div>";
    }).join("");
  }

  function renderTeamRanks() {
    var byGf = standings.slice().sort(function (a, b) {
      return b.gf - a.gf || a.team.localeCompare(b.team, "zh-Hans-CN");
    });
    var byGa = standings.slice().sort(function (a, b) {
      return a.ga - b.ga || a.team.localeCompare(b.team, "zh-Hans-CN");
    });

    renderRank($("rank-gf"), byGf.map(function (r) {
      return { name: r.team, value: r.gf };
    }), "球", hasResults);

    renderRank($("rank-ga"), byGa.map(function (r) {
      return { name: r.team, value: r.ga };
    }), "球", hasResults);

    $("teams-notice").innerHTML = hasResults
      ? ""
      : '<div class="empty">比赛尚未开始，球队榜将在首场比赛结果录入后自动生成。</div>';
  }

  /* ── 渲染：射手榜 ───────────────────────────────── */

  function renderScorers() {
    renderRank($("scorers"), scorers.map(function (s) {
      return { name: s.name, sub: s.team, value: s.goals };
    }), "球", scorers.length > 0);
  }

  /* ── 渲染：赛程（按轮次分组 + 筛选） ────────────── */

  var filter = "all";

  function renderFixtures() {
    var list = (D.matches || []).slice().sort(function (a, b) {
      return (a.round || 0) - (b.round || 0)
          || String(a.date).localeCompare(String(b.date));
    }).filter(function (m) {
      return filter === "all" || m.status === filter;
    });

    if (!list.length) {
      $("fixtures").innerHTML = '<div class="empty">没有符合条件的比赛。</div>';
      return;
    }

    var groups = [];
    list.forEach(function (m) {
      var r = m.round || 0;
      var g = groups[groups.length - 1];
      if (!g || g.round !== r) { g = { round: r, items: [] }; groups.push(g); }
      g.items.push(m);
    });

    $("fixtures").innerHTML = groups.map(function (g) {
      var dates = g.items.map(function (m) { return m.date; }).sort();
      var span = dates.length > 1
        ? fmtDate(dates[0]) + " – " + fmtDate(dates[dates.length - 1])
        : fmtDate(dates[0]);

      var rows = g.items.map(function (m) {
        var played = m.status === "played";
        var mid = played
          ? '<span class="fixture__score">' + m.hg + " – " + m.ag + "</span>"
          : '<span class="fixture__vs">VS</span>';

        return '<div class="fixture' + (played ? "" : " fixture--upcoming") + '">' +
          '<span class="fixture__date">' + fmtDate(m.date) + "</span>" +
          '<span class="fixture__teams">' +
            '<span class="fixture__team">' + esc(m.home) + "</span>" +
            mid +
            '<span class="fixture__team fixture__team--away">' + esc(m.away) + "</span>" +
          "</span>" +
          '<span class="fixture__tag">' + (played ? "已结束" : "未赛") + "</span>" +
        "</div>";
      }).join("");

      return '<div class="round">' +
        '<div class="round__head">' +
          '<span class="round__name">第 ' + g.round + " 轮</span>" +
          '<span class="round__dates">' + span + "</span>" +
        "</div>" +
        '<div class="fixtures">' + rows + "</div>" +
      "</div>";
    }).join("");
  }

  /* ── 交互 ───────────────────────────────────────── */

  $("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;

    Array.prototype.forEach.call(this.querySelectorAll(".tab"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".page"), function (p) {
      p.classList.toggle("active", p.id === btn.dataset.page);
    });
  });

  $("chips").addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    filter = btn.dataset.filter;
    Array.prototype.forEach.call(this.querySelectorAll(".chip"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    renderFixtures();
  });

  /* ── 启动 ───────────────────────────────────────── */

  $("season").textContent = D.season || "";
  $("updated").textContent = D.updated ? "更新于 " + D.updated : "";
  $("foot-league").textContent =
    (D.name || "足球联赛") + (D.season ? " · " + D.season : "");

  renderMetrics();
  renderStandings();
  renderTeamRanks();
  renderScorers();
  renderFixtures();
})();
</script>

<script>
/* 封面影像自动轮播：5 秒换一张，悬停或用键盘聚焦时暂停。
   系统开了「减少动态效果」就不自动播，只保留手动点选。 */
(function () {
  var stage = document.querySelector(".hero__stage");
  var layers = [].slice.call(document.querySelectorAll(".hero__layer"));
  var dots = [].slice.call(document.querySelectorAll(".hero__dot"));
  if (!stage || layers.length < 2) return;

  var at = 0;
  var timer = null;
  var DELAY = 5000;

  var reduce = window.matchMedia
    ? window.matchMedia("(prefers-reduced-motion: reduce)")
    : null;
  var canAuto = !(reduce && reduce.matches);

  function show(n) {
    at = (n + layers.length) % layers.length;

    layers.forEach(function (img, i) {
      img.classList.toggle("is-active", i === at);
    });
    dots.forEach(function (dot, i) {
      dot.classList.toggle("is-active", i === at);
      if (i === at) dot.setAttribute("aria-current", "true");
      else dot.removeAttribute("aria-current");
    });
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function play() {
    stop();
    if (!canAuto || document.hidden) return;
    timer = setInterval(function () { show(at + 1); }, DELAY);
  }

  dots.forEach(function (dot, i) {
    dot.addEventListener("click", function () { show(i); play(); });
  });

  stage.addEventListener("mouseenter", stop);
  stage.addEventListener("mouseleave", play);
  stage.addEventListener("focusin", stop);
  stage.addEventListener("focusout", play);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop(); else play();
  });

  if (reduce && reduce.addEventListener) {
    reduce.addEventListener("change", function (e) {
      canAuto = !e.matches;
      if (canAuto) play(); else stop();
    });
  }

  play();
})();
</script>

</body>
</html>
